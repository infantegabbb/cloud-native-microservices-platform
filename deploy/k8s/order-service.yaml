apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/jeffrey-dev0705/cloud-native-order-service:latest
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8080
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "192Mi" }
---
apiVersion: v1
